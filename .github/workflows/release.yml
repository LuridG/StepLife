# 自动构建并发布 Release
# 触发方式：
#   1. 推送形如 v1.4.9 的 tag（如 git push origin v1.4.9+20260803）
#   2. 在 Actions 页面手动 Run workflow（自动读取 pubspec 版本号）
# 产物：StepLife-v<版本>-universal / arm64-v8a / armeabi-v7a / x86_64 四个 APK
# 签名：正式签名必须通过仓库 Secrets 注入，未配置时构建直接失败（绝不退回 debug 签名）

name: Build & Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: '发布为草稿（默认否，需手动点 Publish）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APKs & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 准备正式签名（GitHub Secrets）
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ]; then
            echo "::error::未配置 ANDROID_KEYSTORE_BASE64 等 Secrets，无法用正式签名构建。"
            echo "::error::请到仓库 Settings -> Secrets and variables -> Actions 添加后重跑，防止再次产出 debug 签名包。"
            exit 1
          fi
          mkdir -p android/keystore
          echo "${KS_B64}" | base64 -d > android/keystore/steplife-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore/steplife-release.jks\n' \
            "${KS_PASS}" "${KEY_PASS}" "${KEY_ALIAS}" > android/key.properties
          echo "正式签名已加载"

      - name: 解析版本号
        id: version
        shell: bash
        run: |
          VER=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version:[[:space:]]*//' | tr -d '\r')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "name=StepLife v$(echo "$VER" | cut -d'+' -f1)" >> "$GITHUB_OUTPUT"

      - name: 构建 Release APK
        run: |
          flutter pub get
          # 先打 3 个 ABI 分包，再打 universal 通用包
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: 规整产物命名并校验
        shell: bash
        run: |
          VER=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version:[[:space:]]*//' | tr -d '\r' | cut -d'+' -f1)
          cd build/app/outputs/flutter-apk || { echo '未找到输出目录'; exit 1; }
          rm -f *.sha1
          for f in app-*.apk; do
            [ -e "$f" ] || continue
            case "$f" in
              *arm64-v8a*) abi=arm64-v8a ;;
              *armeabi-v7a*) abi=armeabi-v7a ;;
              *x86_64*) abi=x86_64 ;;
              *) abi=universal ;;
            esac
            mv -f "$f" "StepLife-v${VER}-${abi}.apk"
          done
          ls -lh StepLife-*.apk
          COUNT=$(ls StepLife-*.apk 2>/dev/null | wc -l)
          test "$COUNT" -ge 1 || { echo '未找到 APK 产物'; exit 1; }
          # 校验正式签名指纹，防止误发 debug 签名包
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          for apk in StepLife-*.apk; do
            if "$APKSIGNER" verify --print-certs "$apk" 2>/dev/null | grep -qi '4d177607a8683469ee20fa229e3000d6b006fa5f09de2d69a034c2c22a1ea69d'; then
              echo "$apk 签名校验通过（正式签名）"
            else
              echo "::error::$apk 不是正式签名，已终止发布"; exit 1
            fi
          done

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            自动构建产物：Flutter ${{ steps.version.outputs.version }}（正式签名）
            - **universal**：通用包，所有设备可用
            - **arm64-v8a**：主流 64 位 Android 设备
            - **armeabi-v7a**：老旧 32 位设备
            - **x86_64**：模拟器 / 平板

            安装说明：日常使用优先选择 **universal** 或 **arm64-v8a**。
          files: |
            build/app/outputs/flutter-apk/StepLife-*.apk
          draft: ${{ github.event.inputs.draft == 'true' }}